<text x="70" y="1012" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0078d4">HOW TO READ</text>
<text x="70" y="1044" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#18334d">Blue: routed traffic and delivery. Purple: DNS proxy queries. Private DNS resolves the service endpoint names.</text>
<text x="70" y="1076" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#52677d">Private endpoint packet paths depend on effective routes and policy. Azure data access still requires RBAC.</text>
